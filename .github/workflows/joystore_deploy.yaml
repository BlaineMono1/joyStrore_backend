---
name: Deploy to server
on:
  push:
    branches:
      - "main"
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up SSH key
        run: |
          env
          mkdir -p ~/.ssh/
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "{{ secrets.SSH_PORT }}" "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Copy repo to host
        run: |
          scp -P "${{ secrets.SSH_PORT }}" $PWD "${{ secrets.SSH_USER }}"@"${{ secrets.SSH_HOST }}":~/repo

      - name: Build and images on host
        run: |
          export ASP_ENV=cloud
          ssh -p "${{ secrets.SSH_PORT }}" << 'ENDSSH'
          cd repo
          docker compose build && docker compose up -d
          cd .. && rm -rf repo
          ENDSSH
